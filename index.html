<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Cult | 이세계 교단 운영 시뮬레이션</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <script>
        // Load shared navbar and adjust links based on current page location
        fetch('components/navbar.html')
            .then(r => r.text())
            .then(html => {
                const container = document.createElement('div');
                container.innerHTML = html;
                // Adjust hrefs for root page (no prefix needed)
                const links = container.querySelectorAll('a');
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    if (href === 'index.html') a.setAttribute('href', 'index.html');
                    else if (href === 'pages/world.html') a.setAttribute('href', 'pages/world.html');
                    else if (href === 'pages/characters.html') a.setAttribute('href', 'pages/characters.html');
                    else if (href === 'pages/system.html') a.setAttribute('href', 'pages/system.html');
                });
                document.getElementById('navbar').innerHTML = container.innerHTML;
            });
    </script>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>이세계 교단 운영 시뮬레이션</h1>
                <p>다섯 문명이 교차하는 곳, 당신의 통치와 교단의 조화로 새로운 역사를 쓰십시오.</p>
                <div class="hero-buttons">
                    <a href="pages/world.html" class="btn btn-primary">세계관 탐색</a>
                    <a href="pages/system.html" class="btn btn-secondary">시스템 가이드</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Isekai Cult Simulation. All rights reserved.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
