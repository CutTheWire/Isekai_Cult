<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Cult | 종족 도감</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/data.js"></script>
    <!-- Markdown parser for rendering detailed civilization descriptions -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="logo"><a href="../index.html">ISEKAI CULT</a></div>
            <ul class="nav-links">
                <li><a href="../index.html">홈</a></li>
                <li><a href="world.html">세계관</a></li>
                <li><a href="characters.html" class="active">종족 도감</a></li>
                <li><a href="system.html">시스템 가이드</a></li>
            </ul>
        </nav>
    </header>

    <main class="characters-page">
        <section class="intro">
            <h2>종족 도감</h2>
            <div class="character-controls">
                <input id="search" class="search-input" type="search" placeholder="검색 (이름 / 설명 등)">
                <select id="filter" class="filter-select">
                    <option value="all">모두 표시</option>
                </select>
            </div>
            <div class="civilization-grid" id="civ-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Isekai Cult Simulation. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // wait until markdowns are loaded by data.js
            if (window.civilizationsReady) await window.civilizationsReady;

            const grid = document.getElementById('civ-grid');
            const search = document.getElementById('search');
            const filter = document.getElementById('filter');
            if (!grid || typeof civilizations === 'undefined') return;

            // compute asset base depending on page location
            const assetBase = (function() {
                const p = location.pathname;
                if (p.includes('/pages/')) return '../assets/images/characters/';
                return 'assets/images/characters/';
            })();

            // populate filter options based on civilization names
            const names = Array.from(new Set(civilizations.map(c => c.name)));
            names.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n;
                filter.appendChild(opt);
            });

            function renderGrid() {
                const q = (search.value || '').trim().toLowerCase();
                const f = filter.value;
                const list = civilizations.filter(civ => {
                    if (f !== 'all' && civ.name !== f) return false;
                    if (!q) return true;
                    const hay = (civ.name + ' ' + civ.alias + ' ' + civ.shortDescription + ' ' + (civ.detailMarkdown || '')).toLowerCase();
                    return hay.includes(q);
                });

                // Build structured HTML for each civilization using semantic elements
                grid.innerHTML = list.map(civ => {
                    const imgSrc = assetBase + encodeURIComponent(civ.imageFile);
                    return `
                    <div class="civ-card" style="border-left: 6px solid ${civ.colorVar};">
                        <img src="${imgSrc}" alt="${civ.name}" loading="lazy" />
                        <article class="civ-body">
                            <header>
                                <h3 style="color: ${civ.colorVar}; text-align: left; margin-bottom: 0.2rem;">${civ.name}</h3>
                                <p class="muted" style="text-align: left; font-weight: bold; margin-bottom: 0.5rem;">${civ.theme}</p>
                            </header>
                            <section class="description" style="font-size:0.95rem; text-align: left;">
                                ${marked.parse(civ.detailMarkdown || '')}
                            </section>
                        </article>
                    </div>
                `;
                }).join('');
            }

            // events
            // When typing in the search box, reset the filter to "all"
            search.addEventListener('input', () => {
                filter.value = 'all';
                renderGrid();
            });
            // When selecting a name filter, clear the search input
            filter.addEventListener('change', () => {
                search.value = '';
                renderGrid();
            });

            // initial render
            renderGrid();
        });
    </script>
</body>
</html>
