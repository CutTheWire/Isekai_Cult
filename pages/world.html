<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Cult | 세계관</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/data.js"></script>
    <!-- Markdown parser for world overview -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="navbar"></div>
    <script>
        // Load shared navbar for subpages (relative path)
        fetch('../components/navbar.html')
            .then(r => r.text())
            .then(html => {
                const container = document.createElement('div');
                container.innerHTML = html;
                // Update links to be relative to this page
                const links = container.querySelectorAll('a');
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    if (href === 'index.html') a.setAttribute('href', '../index.html');
                    else if (href === 'pages/world.html') a.setAttribute('href', 'world.html');
                    else if (href === 'pages/characters.html') a.setAttribute('href', 'characters.html');
                    else if (href === 'pages/system.html') a.setAttribute('href', 'system.html');
                });
                // Mark current page as active
                const path = location.pathname.split('/').pop();
                const activeLink = container.querySelector(`a[href="${path}"]`);
                if (activeLink) activeLink.classList.add('active');
                document.getElementById('navbar').innerHTML = container.innerHTML;
            });
    </script>

    <main class="world-page">
        <section id="world-overview" class="wiki">
            <div class="world-hero">
                <img
                    src="../assets/images/backgrounds/세계.png"
                    alt="세계 지도">
            </div>
            <br>
            <div id="civ-grid" class="civilization-grid"></div>
            <br>
            <article id="world-markdown"></article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Isekai Cult Simulation. All rights reserved.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/world.js"></script>
</body>
</html>
